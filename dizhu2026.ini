[config]
; =========================================================
; 1. 内核 DNS 防泄露与旁路由共享设置
; =========================================================
dns.enable=true
dns.listen=0.0.0.0:53
dns.ipv6=false
dns.enhanced-mode=fake-ip
dns.fake-ip-range=198.18.0.1/16

; Fake-IP 过滤名单
dns.fake-ip-filter[]=*.lan
dns.fake-ip-filter[]=*.local
dns.fake-ip-filter[]=*.localhost
dns.fake-ip-filter[]=time.*.com
dns.fake-ip-filter[]=ntp.*.com
dns.fake-ip-filter[]=+.market.xiaomi.com
dns.fake-ip-filter[]=+.push.apple.com

; 启动 Bootstrap DNS
dns.default-nameserver[]=223.5.5.5
dns.default-nameserver[]=119.29.29.29

; 全局默认加密 DNS (防止 whoer 测速时抢答泄露)
dns.nameserver[]=https://1.1.1.1/dns-query
dns.nameserver[]=https://8.8.8.8/dns-query

; 社区主流的国内/海外精准分流解析策略
dns.nameserver-policy['geosite:cn,private'][]=https://223.5.5.5/dns-query
dns.nameserver-policy['geosite:cn,private'][]=https://119.29.29.29/dns-query
dns.nameserver-policy['geosite:geolocation-!cn'][]=https://1.1.1.1/dns-query
dns.nameserver-policy['geosite:geolocation-!cn'][]=https://8.8.8.8/dns-query

; DNS 回落过滤器
dns.fallback-filter.geoip=true
dns.fallback-filter.geoip-code=CN
dns.fallback-filter.ipcidr[]=240.0.0.0/4
dns.fallback-filter.ipcidr[]=127.0.0.1/32
dns.fallback-filter.ipcidr[]=0.0.0.0/32

; 开启域名嗅探
sniffer.enable=true
sniffer.force-dns-mapping=true
sniffer.parse-pure-ip=true
sniffer.sniff.HTTP.ports[]=[80]
sniffer.sniff.HTTP.override-destination=true
sniffer.sniff.TLS.ports[]=[443, 8443]
sniffer.sniff.QUIC.ports[]=[443, 8443]


[custom]
; =========================================================
; 2. 社区精选分流与防泄漏规则链 (修复语法错误版)
; =========================================================

; 2.1 局域网与保留地址
ruleset=DIRECT,[]GEOIP,LAN,no-resolve
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 2.2 WebRTC STUN 协议双重封堵 (防真实 IP 泄漏)
ruleset=REJECT,[]DST-PORT,3478
ruleset=REJECT,[]DOMAIN-KEYWORD,stun

; 2.3 广告拦截
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; 2.4 AI 与特殊服务单独加速
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,openai.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,claude.ai

; 2.5 特殊直连与去广告白名单
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list

; 2.6 国内 IP 判定 (带 no-resolve)
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list,no-resolve
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list,no-resolve
ruleset=DIRECT,[]GEOIP,CN,no-resolve

; 2.7 兜底分流
ruleset=🚀 节点选择,[]FINAL

; =========================================================
; 3. 策略组设计
; =========================================================
custom_proxy_group=🚀 节点选择`select`[]⚡ 断网自选最优`[]DIRECT`.*
custom_proxy_group=⚡ 断网自选最优`url-test`.*`http://www.gstatic.com/generate_204`300,3000,350,lazy=true

enable_rule_generator=true
overwrite_original_rules=true
